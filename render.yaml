# Render blueprint for DiamondScope.
# Push to GitHub, then in Render: New + > Blueprint > pick this repo.
# Render reads this file and provisions all three services in one go.
#
# Free-tier notes:
#   - Web services on the free plan sleep after 15 minutes of inactivity; first
#     request after sleep is slow.
#   - The free plan does NOT support persistent disks. The Parquet cache lives
#     inside the container and is wiped on every deploy / restart, so the
#     first player lookup after a deploy will be slow (~30-60 s) while the
#     data layer re-fetches from FanGraphs / Statcast.
#   - To get a persistent cache: change the `api` service plan from `free` to
#     `starter` ($7/mo) and uncomment the `disk:` block at the bottom of this
#     file ($1/mo for 1 GB).
#   - The free Postgres instance is wiped after 90 days. Saved analyses and
#     user accounts will be lost. Use the `starter` Postgres plan ($7/mo) if
#     you care about persistence.

databases:
  - name: diamondscope-db
    plan: free
    databaseName: diamondscope
    user: diamondscope

services:
  - type: web
    name: diamondscope-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: diamondscope-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false   # set in Render dashboard to your web service URL
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRE_MINUTES
        value: "720"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CACHE_DIR
        value: /app/cache    # ephemeral on free tier; replace with disk mount when upgrading
      - key: DEFAULT_SEASON_WINDOW
        value: "6"
    # To enable persistent cache, upgrade plan: above to `starter` and uncomment:
    # disk:
    #   name: cache
    #   mountPath: /var/cache/diamondscope
    #   sizeGB: 1
    # (and change CACHE_DIR to /var/cache/diamondscope)

  - type: web
    name: diamondscope-web
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npx vite preview --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: VITE_API_BASE_URL
        sync: false   # set to the diamondscope-api URL
